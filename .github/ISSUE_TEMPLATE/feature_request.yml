name: Feature request
description: Suggest a new skill, example, or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe what you need and why it would help
        functional consultants or developers using this plugin.
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New skill
        - New example in EXAMPLES.md
        - Improve existing skill
        - New AI assistant support
        - Azure deployment / CI-CD
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: |
        As a functional consultant, I want to ... so that ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: |
        Describe what the new skill/feature should do and what MCP tools it would use.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: additional
    attributes:
      label: Additional context (screenshots, example prompts, etc.)